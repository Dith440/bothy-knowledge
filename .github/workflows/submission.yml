# The robot behind the "Share guides" form: checks the attached pack file and opens a pull request for review.
# The issue text is passed as data (environment variables), never run as code.
name: Shared guides

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: share-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: contains(github.event.issue.body, '### The pack file')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Check the file and open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          BASE_REF: origin/main
        run: python3 tools/submission.py
