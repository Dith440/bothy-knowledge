# Publishes the catalogue and pack files on GitHub Pages after every change on main.
# Decks read https://<owner>.github.io/bothy-knowledge/catalogue.json.
name: Publish catalogue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read   # deploy-pages reads the uploaded artifact
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # GitHub Pages needs a public repository (or a paid plan): skip while the collection is private.
    # Once public, turn on Pages with "GitHub Actions" as the source (Settings > Pages).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow cryptography
      - run: python3 tools/check.py
      # Signed with the collection's key (repository secret CATALOGUE_SIGNING_KEY); Bothy checks the signature.
      - run: python3 tools/build.py dist --require-signature
        env:
          CATALOGUE_SIGNING_KEY: ${{ secrets.CATALOGUE_SIGNING_KEY }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
